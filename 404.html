<style>
:root{--bg:#050f14;--card:#0e1f24;--line:rgba(150,210,225,.12);--text:#e7f3f5;--muted:#a6c4ca;--tide:#0a71a1;--link:#7fd0f7;--glow1:rgba(10,113,161,.22);--glow2:rgba(127,208,247,.16)}
@media (prefers-color-scheme:light){:root{--bg:#e6f4f6;--card:#f5fcfd;--line:rgba(6,40,46,.14);--text:#0b1f24;--muted:#2a464d;--link:#0a71a1;--glow1:rgba(10,113,161,.10);--glow2:rgba(127,208,247,.12)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;color:var(--text);font:400 16px/1.6 "Instrument Sans",system-ui,sans-serif;
  background:radial-gradient(46% 30% at 88% 0%,var(--glow1),transparent 60%),radial-gradient(40% 26% at 4% 100%,var(--glow2),transparent 65%),var(--bg)}
main{max-width:520px;text-align:center}
.code{font:700 15px/1 "Instrument Sans",sans-serif;letter-spacing:.14em;color:var(--muted)}
h1{font:700 clamp(34px,7vw,48px)/1.1 "Bricolage Grotesque",sans-serif;margin:12px 0}
p{color:var(--muted);margin:0 0 24px}
nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
a{color:var(--text);text-decoration:none;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;font-weight:500}
a.primary{background:var(--tide);border-color:var(--tide);color:#fff}
