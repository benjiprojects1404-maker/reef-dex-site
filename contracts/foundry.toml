# Foundry tests for the Reef AMM (stateful fuzzing). Hardhat stays the main build.
# Compiler settings match hardhat.config.js so the bytecode is the same as the deployed build.
[profile.default]
src = "contracts/reef"
test = "test/foundry"
out = "out-foundry"
cache_path = "cache-foundry"
libs = ["lib", "node_modules"]
solc_version = "0.8.24"
evm_version = "berlin"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./" }]

[fuzz]
runs = 256

[invariant]
runs = 256
depth = 100
fail_on_revert = false
show_metrics = true

[profile.ci.invariant]
runs = 1000
depth = 200

[profile.ci.fuzz]
runs = 10000
