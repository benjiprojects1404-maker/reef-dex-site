name: Contract tests

# Runs Reef's contract tests on every pull request that touches the contracts, and on main.
# A red cross on the PR means a test failed: don't merge until it's green.
on:
  pull_request:
    paths: ["contracts/**", ".github/workflows/tests.yml"]
  push:
    branches: [main]
    paths: ["contracts/**", ".github/workflows/tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardhat:
    name: Hardhat tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx hardhat test

  foundry:
    name: Foundry fuzz and invariant tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - run: npm ci --no-audit --no-fund # OpenZeppelin, read from node_modules
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: forge-std (same version as the local setup)
        run: git clone --depth 1 --branch v1.17.0 https://github.com/foundry-rs/forge-std lib/forge-std
      - run: forge test # default profile (256 runs); FOUNDRY_PROFILE=ci for the deep run
